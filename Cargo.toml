[package]
name = "blakeout-gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
# CUDA bindings
cudarc = { version = "0.9", features = ["driver"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Blake2 для CPU fallback
blake2 = "0.10"
digest = "0.10"
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "blakeout_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[build-dependencies]
# No build dependencies needed